<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in"
  (click)="closeModal()"
>
  <div
    class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full animate-scale-in"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-center mb-4">
      <div
        class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center"
      >
        <svg
          class="w-8 h-8 text-purple-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          ></path>
        </svg>
      </div>
    </div>
    <h3 class="text-2xl font-bold text-gray-900 text-center mb-3">
      Login Necessário
    </h3>
    <p class="text-center text-gray-600 mb-6">
      Você precisa estar logado para favoritar livros. Deseja fazer login agora?
    </p>
    <div class="flex gap-3">
      <button
        (click)="loginNow()"
        class="flex-1 px-6 py-3 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white font-semibold rounded-xl transition-all duration-300"
      >
        Fazer Login
      </button>
      <button
        (click)="closeModal()"
        class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition-all duration-300"
      >
        Cancelar
      </button>
    </div>
  </div>
</div>
