<div
  *ngIf="message"
  class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in"
  (click)="closeModal()"
>
  <div
    class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full animate-scale-in"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-center mb-4">
      <div
        class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center"
      >
        <svg
          class="w-8 h-8 text-green-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 13l4 4L19 7"
          ></path>
        </svg>
      </div>
    </div>
    <p class="text-center text-gray-800 text-lg mb-6">
      {{ message }}
    </p>
    <button
      (click)="closeModal()"
      class="w-full px-6 py-3 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white font-semibold rounded-xl transition-all duration-300"
    >
      Fechar
    </button>
  </div>
</div>
