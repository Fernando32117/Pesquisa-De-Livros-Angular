<div
  *ngIf="book"
  class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in"
  (click)="closeModal()"
>
  <div
    class="bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto animate-scale-in"
    (click)="$event.stopPropagation()"
  >
    <div
      class="sticky top-0 bg-gradient-to-r from-violet-600 to-purple-600 text-white px-8 py-6 flex justify-between items-center rounded-t-3xl"
    >
      <h2 class="text-2xl font-bold">Detalhes do Livro</h2>
      <button
        (click)="closeModal()"
        class="w-10 h-10 rounded-full bg-white bg-opacity-20 hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <div class="p-8">
      <div class="grid md:grid-cols-3 gap-8">
        <div class="md:col-span-1">
          <div class="sticky top-24">
            <div class="relative group">
              <div
                class="absolute -inset-1 bg-gradient-to-r from-violet-600 to-fuchsia-600 rounded-2xl blur opacity-25"
              ></div>
              <img
                [src]="getCoverUrl(book.thumbnail)"
                (error)="onImageError($event)"
                alt="Capa do Livro"
                class="relative w-full rounded-2xl shadow-xl"
              />
            </div>
          </div>
        </div>

        <div class="md:col-span-2 space-y-6">
          <div>
            <h3 class="text-3xl font-bold text-gray-900 mb-3">
              {{ book.title }}
            </h3>
            <p class="text-xl text-purple-600 font-semibold">
              {{ book.authors.join(", ") }}
            </p>
          </div>

          <div class="space-y-4">
            <div class="bg-gray-50 rounded-xl p-4">
              <h4 class="text-sm font-semibold text-gray-500 uppercase mb-2">
                Descricao
              </h4>
              <p class="text-gray-700 leading-relaxed">
                {{ book.description || "Descricao nao disponivel." }}
              </p>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="bg-purple-50 rounded-xl p-4">
                <h4 class="text-sm font-semibold text-purple-600 mb-2">
                  Data de Lancamento
                </h4>
                <p class="text-gray-800">
                  {{ book.publishedDate || "Nao informada" }}
                </p>
              </div>

              <div class="bg-fuchsia-50 rounded-xl p-4">
                <h4 class="text-sm font-semibold text-fuchsia-600 mb-2">
                  Editora
                </h4>
                <p class="text-gray-800">
                  {{ book.publisher || "Nao informada" }}
                </p>
              </div>
            </div>
          </div>

          <div class="flex flex-wrap gap-3 pt-4">
            <a
              *ngIf="book.readUrl"
              [href]="book.readUrl"
              target="_blank"
              rel="noopener"
              class="flex-1 min-w-[140px] px-6 py-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-semibold rounded-xl text-center transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg"
            >
              Ver Livro
            </a>
            <a
              *ngIf="book.infoUrl"
              [href]="book.infoUrl"
              target="_blank"
              rel="noopener"
              class="flex-1 min-w-[140px] px-6 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold rounded-xl text-center transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg"
            >
              Mais Detalhes
            </a>
            <a
              *ngIf="book.buyUrl"
              [href]="book.buyUrl"
              target="_blank"
              rel="noopener"
              class="flex-1 min-w-[140px] px-6 py-3 bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-semibold rounded-xl text-center transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg"
            >
              Comprar
            </a>
            <a
              *ngIf="book.pdfUrl"
              [href]="book.pdfUrl"
              target="_blank"
              rel="noopener"
              class="flex-1 min-w-[140px] px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-semibold rounded-xl text-center transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg"
            >
              Baixar PDF
            </a>
          </div>

          <button
            (click)="onSaveFavorite()"
            class="w-full px-6 py-4 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-bold rounded-xl transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg flex items-center justify-center gap-2"
          >
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
              ></path>
            </svg>
            <span>Adicionar aos Favoritos</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
