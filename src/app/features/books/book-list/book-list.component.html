<!-- Book Grid -->
<div
  class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 px-2 py-4"
>
  <div
    *ngFor="let book of books"
    class="group w-full max-w-[240px] mx-auto bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 overflow-hidden cursor-pointer animate-scale-in"
    (click)="openModal(book)"
  >
    <!-- Book Cover -->
    <div
      class="relative overflow-hidden bg-gradient-to-br from-purple-100 to-fuchsia-100 aspect-[3/4]"
    >
      <img
        [src]="getCoverUrl(book.thumbnail)"
        (error)="onImageError($event)"
        alt="Capa do Livro"
        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
      />
      <div
        class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-opacity duration-300"
      ></div>
    </div>

    <!-- Book Info -->
    <div class="p-4">
      <h2
        class="text-base font-bold text-gray-800 mb-1.5 line-clamp-2 group-hover:text-purple-700 transition-colors"
      >
        {{ book.title }}
      </h2>
      <p class="text-sm text-gray-600 mb-3 line-clamp-1">
        {{ book.authors.join(", ") }}
      </p>

      <!-- Action Buttons -->
      <div class="flex gap-2">
        <button
          (click)="openModal(book); $event.stopPropagation()"
          class="flex-1 px-3 py-2 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white text-sm font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 active:scale-95"
        >
          Ver Detalhes
        </button>
        <button
          (click)="toggleFavorite(book); $event.stopPropagation()"
          class="px-3 py-2 border-2 rounded-xl transition-all duration-300 transform hover:scale-105 active:scale-95"
          [ngClass]="
            isFavorite(book)
              ? 'border-pink-500 bg-pink-50 text-pink-600 hover:bg-pink-100'
              : 'border-gray-300 text-gray-600 hover:border-purple-500 hover:text-purple-600 hover:bg-purple-50'
          "
        >
          <svg
            class="w-5 h-5"
            [ngClass]="isFavorite(book) ? 'fill-current' : 'fill-none'"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<app-book-details-modal
  [book]="selectedBook"
  [fallbackImage]="fallbackImage"
  (close)="closeModal()"
  (saveFavorite)="saveFavorite($event)"
></app-book-details-modal>

<app-notification-modal
  [message]="notificationMessage"
  (close)="notificationMessage = null"
></app-notification-modal>

<app-login-required-modal
  [isOpen]="showLoginModal"
  (close)="closeLoginModal()"
  (login)="navigateToLogin()"
></app-login-required-modal>
