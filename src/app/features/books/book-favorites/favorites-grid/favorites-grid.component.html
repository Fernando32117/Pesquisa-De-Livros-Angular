<div class="max-w-7xl mx-auto">
  <div
    class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 px-2 py-4"
  >
    <div
      *ngFor="let book of favorites"
      class="group bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 overflow-hidden cursor-pointer animate-scale-in flex flex-col h-full"
    >
      <div
        class="relative overflow-hidden bg-gradient-to-br from-purple-100 to-fuchsia-100 lg:aspect-[3/4] aspect-square"
      >
        <img
          [src]="getCoverUrl(book.thumbnail)"
          (error)="onImageError($event)"
          alt="Capa do Livro"
          class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
        />
        <div
          class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-opacity duration-300"
        ></div>

        <div class="absolute top-3 right-3">
          <div class="bg-pink-500 text-white p-2 rounded-full shadow-lg">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
              ></path>
            </svg>
          </div>
        </div>
      </div>

      <div class="p-4 flex flex-col flex-1">
        <h2
          class="text-lg font-bold text-gray-800 mb-2 line-clamp-2 group-hover:text-purple-700 transition-colors"
        >
          {{ book.title }}
        </h2>
        <p class="text-sm text-gray-600 mb-4 line-clamp-1">
          {{ book.authors.join(", ") }}
        </p>

        <div class="flex gap-2 mt-auto">
          <button
            (click)="openDetails(book)"
            class="flex-1 lg:px-3 py-2 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white text-sm font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 active:scale-95"
          >
            Ver Detalhes
          </button>
          <button
            (click)="removeFavorite(book.id)"
            class="px-3 py-2 bg-red-50 border-2 border-red-300 text-red-600 font-semibold text-sm rounded-xl hover:bg-red-100 hover:border-red-400 transition-all duration-300 transform hover:scale-105 active:scale-95"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
