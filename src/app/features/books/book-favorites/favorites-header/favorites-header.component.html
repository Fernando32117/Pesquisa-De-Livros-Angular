<div class="max-w-7xl mx-auto mb-12">
  <div class="text-center mb-8 animate-fade-in mt-8">
    <h1
      class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-violet-600 via-purple-600 to-fuchsia-600 bg-clip-text text-transparent leading-tight pb-2"
    >
      Meus Livros Favoritos
    </h1>
    <p class="text-gray-600 text-lg">
      Sua coleção pessoal de leituras especiais
    </p>
  </div>

  <div class="max-w-2xl mx-auto animate-slide-up">
    <div class="relative group">
      <div
        class="absolute -inset-0.5 bg-gradient-to-r from-violet-600 to-fuchsia-600 rounded-2xl blur opacity-20 group-hover:opacity-30 transition duration-300"
      ></div>
      <div class="relative flex bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="flex-1 flex items-center px-6 py-4">
          <svg
            class="w-6 h-6 text-gray-400 mr-3"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
            ></path>
          </svg>
          <input
            type="text"
            [ngModel]="filter"
            (ngModelChange)="onFilterChange($event)"
            placeholder="Filtrar por titulo ou tag..."
            class="flex-1 outline-none text-lg text-gray-700 placeholder-gray-400"
          />
        </div>
      </div>
    </div>
  </div>
</div>
