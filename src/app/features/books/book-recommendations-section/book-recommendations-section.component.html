<div class="max-w-7xl mx-auto flex items-center justify-between mb-3">
  <h2 class="text-2xl font-bold text-gray-800">Sugestoes para voce</h2>
  <span class="text-sm text-violet-700 bg-violet-100 rounded-full px-3 py-1">
    {{ selectedFilterLabel }}
  </span>
</div>

<div
  *ngIf="isRecommendationsLoading"
  class="flex flex-col items-center justify-center py-8"
>
  <div
    class="w-10 h-10 border-4 border-violet-200 border-t-violet-600 rounded-full animate-spin"
  ></div>
  <p class="mt-3 text-violet-700 font-medium">Carregando recomendacoes...</p>
</div>

<div
  *ngIf="recommendationsErrorMessage && !isRecommendationsLoading"
  class="max-w-2xl mx-auto mb-6 animate-scale-in"
>
  <div
    class="bg-amber-50 border border-amber-200 rounded-2xl p-5 flex items-start space-x-3"
  >
    <svg
      class="w-6 h-6 text-amber-500 flex-shrink-0 mt-0.5"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
      ></path>
    </svg>
    <p class="text-amber-700">{{ recommendationsErrorMessage }}</p>
  </div>
</div>

<div
  *ngIf="
    hasLoadedRecommendations &&
    !isRecommendationsLoading &&
    !recommendationsErrorMessage &&
    recommendedBooks.length === 0
  "
  class="max-w-3xl mx-auto text-center py-8"
>
  <p class="text-gray-500">
    Nenhuma recomendação encontrada para esse filtro agora.
  </p>
</div>

<div
  *ngIf="recommendedBooks.length > 0 && !isRecommendationsLoading"
  class="max-w-7xl mx-auto animate-fade-in mb-10"
>
  <app-book-list [books]="recommendedBooks"></app-book-list>
</div>
