<nav
  class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-lg shadow-lg"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <!-- Logo -->
      <a
        routerLink="/"
        href="book-search"
        class="flex items-center space-x-3 group"
      >
        <div class="relative">
          <div
            class="absolute -inset-1 bg-gradient-to-r from-violet-600 to-fuchsia-600 rounded-lg blur opacity-30 group-hover:opacity-50 transition duration-300"
          ></div>
          <div
            class="relative bg-gradient-to-br from-violet-600 to-purple-600 p-2.5 rounded-lg"
          >
            <svg
              class="w-7 h-7 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
              ></path>
            </svg>
          </div>
        </div>
        <div class="flex flex-col leading-tight">
          <span
            class="text-xl font-bold bg-gradient-to-r from-violet-600 to-purple-600 bg-clip-text text-transparent"
          >
            Explorador
          </span>
          <span class="text-sm font-semibold text-gray-600"> de Livros </span>
        </div>
      </a>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-2">
        <a
          (click)="goBook()"
          href="book-search"
          class="px-4 py-2 text-gray-700 hover:text-purple-600 font-medium rounded-lg hover:bg-purple-50 transition-all duration-300"
        >
          Início
        </a>
        <a
          *ngIf="isAuthenticated()"
          (click)="goFavorite()"
          href="favorites"
          class="px-4 py-2 text-gray-700 hover:text-purple-600 font-medium rounded-lg hover:bg-purple-50 transition-all duration-300"
        >
          Favoritos
        </a>
        <a
          href="about"
          class="px-4 py-2 text-gray-700 hover:text-purple-600 font-medium rounded-lg hover:bg-purple-50 transition-all duration-300"
        >
          Sobre
        </a>

        <!-- User Info / Auth -->
        <div
          class="flex items-center space-x-3 ml-4 pl-4 border-l border-gray-200"
        >
          <span
            *ngIf="isAuthenticated()"
            class="flex items-center space-x-2 px-3 py-2 bg-gradient-to-r from-violet-50 to-purple-50 rounded-lg"
          >
            <span class="text-2xl">👤</span>
            <span class="font-semibold text-gray-700">{{ username }}</span>
          </span>

          <a
            *ngIf="!isAuthenticated()"
            routerLink="/login"
            href="login"
            class="px-6 py-2.5 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white font-semibold rounded-lg transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-md"
          >
            Login
          </a>

          <button
            *ngIf="isAuthenticated()"
            (click)="logout()"
            class="px-6 py-2.5 bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white font-semibold rounded-lg transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-md"
          >
            Sair
          </button>
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <button
        (click)="toggleDropdown()"
        class="md:hidden p-2.5 rounded-lg hover:bg-purple-50 transition-colors"
      >
        <svg
          class="w-7 h-7 text-gray-700"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            *ngIf="!dropdownOpen"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
          <path
            *ngIf="dropdownOpen"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div
      *ngIf="dropdownOpen"
      class="md:hidden border-t border-gray-200 py-4 space-y-2 animate-fade-in"
    >
      <span
        *ngIf="isAuthenticated()"
        class="flex items-center justify-center space-x-2 px-4 py-3 bg-gradient-to-r from-violet-50 to-purple-50 rounded-lg mx-2 mb-3"
      >
        <span class="text-2xl">👤</span>
        <span class="font-semibold text-gray-700">Olá, {{ username }}!</span>
      </span>

      <a
        (click)="goBook()"
        href="book-search"
        class="block px-4 py-3 text-gray-700 hover:text-purple-600 font-medium rounded-lg hover:bg-purple-50 transition-all duration-300 mx-2"
      >
        Início
      </a>
      <a
        *ngIf="isAuthenticated()"
        (click)="goFavorite()"
        href="favorites"
        class="block px-4 py-3 text-gray-700 hover:text-purple-600 font-medium rounded-lg hover:bg-purple-50 transition-all duration-300 mx-2"
      >
        Favoritos
      </a>
      <a
        href="about"
        class="block px-4 py-3 text-gray-700 hover:text-purple-600 font-medium rounded-lg hover:bg-purple-50 transition-all duration-300 mx-2"
      >
        Sobre
      </a>

      <div class="pt-3 border-t border-gray-200 mx-2 mt-3">
        <a
          *ngIf="!isAuthenticated()"
          routerLink="/login"
          href="login"
          class="block px-4 py-3 bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 text-white font-semibold rounded-lg text-center transition-all duration-300 shadow-md"
        >
          Login
        </a>

        <button
          *ngIf="isAuthenticated()"
          (click)="logout()"
          class="w-full px-4 py-3 bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white font-semibold rounded-lg transition-all duration-300 shadow-md"
        >
          Sair
        </button>
      </div>
    </div>
  </div>
</nav>
