<!-- Produção -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Explorador de Livros</title>

    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://covers.openlibrary.org https://openlibrary.org https://books.google.com https://*.googleusercontent.com; connect-src 'self' https://openlibrary.org https://www.googleapis.com; style-src 'self' 'unsafe-inline'; media-src 'self' data: *; upgrade-insecure-requests;"
    />

    <!-- Verificação do Google Search Console" -->
    <meta name="google-site-verification" content="f-brwq9s9O_O8Dl2rMdSLBOS8q03yshbrBrNbZg3Nvw" />

    <!-- Descrição para SEO -->
    <meta name="description" content="Pesquise e explore uma variedade de livros fantásticos através do Google Books API. Descubra novas leituras e encontre seus favoritos!" />

    <!-- Palavras-chave para SEO -->
    <meta name="keywords" content="livros, pesquisa de livros, pesquisar livros, explorar livros, Google Books API, leitura, literatura, acervo, livraria, todos os tipos de livros" />

    <!-- Autor -->
    <meta name="author" content="Fernando Souza" />

    <!-- Open Graph (para compartilhamento no Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Explorador de Livros - Descubra seus Livros Favoritos" />
    <meta property="og:description" content="Pesquise e explore uma variedade de livros incríveis através do Google Books API." />
    <meta property="og:image" content="https://pesquisa-livros.netlify.app/assets/thumbnail.png" />
    <meta property="og:url" content="https://pesquisa-livros.netlify.app/" />
    <meta property="og:site_name" content="Explorador de Livros" />

    <!-- Twitter Card (para compartilhamento no Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Explorador de Livros - Descubra seus Livros Favoritos" />
    <meta name="twitter:description" content="Pesquise e explore uma variedade de livros incríveis através do Google Books API." />
    <meta name="twitter:image" content="https://pesquisa-livros.netlify.app/assets/thumbnail.png" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- JSON-LD para SEO Estruturado -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Explorador de Livros",
        "url": "https://pesquisa-livros.netlify.app/",
        "description": "Pesquise e explore uma variedade de livros fantásticos através do Google Books API.",
        "author": {
          "@type": "Person",
          "name": "Fernando Souza",
          "url": "https://pesquisa-livros.netlify.app/",
          "sameAs": [
            "https://www.linkedin.com/in/gerfernandosouza/",
            "https://github.com/Fernando32117"
          ]
        },
        "publisher": {
          "@type": "Organization",
          "name": "Explorador de Livros",
          "url": "https://pesquisa-livros.netlify.app/"
        }
      }
      </script>
        
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
